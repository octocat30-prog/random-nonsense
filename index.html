        body {
            background-color: lightblue;

            text-align: center;
            margin: 0;
            padding-bottom: 50px;
            overflow: hidden; /* Prevents scrollbars when objects bounce */
            user-select: none;
        }

        #drop-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background-color: #ff4757;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 9999;
        }

        #drop-btn:hover { background-color: #ff6b81; }

        img {
            display: block;
            margin: auto;
            pointer-events: none; /* Prevents default browser image drag */
        }

        .avant-garde-box {
            border: 3px dashed #333;
            padding: 10px;
            margin: 15px auto;
            display: inline-block;
            background-color: rgba(255, 255, 255, 0.4);
        }

        /* Class applied to elements when turned into physics objects */
        .physics-element {
            position: fixed !important;
            margin: 0 !important;
            will-change: transform;
            z-index: 100;
            cursor: grab;
            touch-action: none;
        }

        .physics-element:active {
            cursor: grabbing;
        }
    </style>

    <script>
        function dropThePage() {
            document.getElementById('drop-btn').style.display = 'none';

            const elements = Array.from(document.querySelectorAll('body > h1, body > p, body > .avant-garde-box'));
            const physicsObjects = [];

            let draggedObj = null;
            let dragOffsetX = 0;
            let dragOffsetY = 0;
            let lastMouseX = 0;
            let lastMouseY = 0;
            let mouseVx = 0;
            let mouseVy = 0;

            // Tracking Window Position Across Screen
            let lastWindowX = window.screenX || window.screenLeft || 0;
            let lastWindowY = window.screenY || window.screenTop || 0;

            // Convert elements to absolute positioning
            elements.forEach(el => {
                const rect = el.getBoundingClientRect();
                
                el.style.width = rect.width + 'px';
                el.style.height = rect.height + 'px';
                el.style.left = rect.left + 'px';
                el.style.top = rect.top + 'px';
                el.classList.add('physics-element');

                const obj = {
                    element: el,
                    x: rect.left,
                    y: rect.top,
                    vx: (Math.random() - 0.5) * 6,
                    vy: Math.random() * -5,
                    rotation: 0,
                    vRot: (Math.random() - 0.5) * 4,
                    width: rect.width,
                    height: rect.height,
                    bounciness: 0.6,
                    isDragged: false
                };

                physicsObjects.push(obj);

                // Mouse & Touch Drag Listeners
                el.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY, obj));
                el.addEventListener('touchstart', (e) => {
                    const touch = e.touches[0];
                    startDrag(touch.clientX, touch.clientY, obj);
                }, { passive: true });
            });

            function startDrag(clientX, clientY, obj) {
                draggedObj = obj;
                obj.isDragged = true;
                dragOffsetX = clientX - obj.x;
                dragOffsetY = clientY - obj.y;
                lastMouseX = clientX;
                lastMouseY = clientY;
                obj.vx = 0;
                obj.vy = 0;
            }

            // Tracking Mouse Movement & Velocity
            window.addEventListener('mousemove', (e) => handleMove(e.clientX, e.clientY));
            window.addEventListener('touchmove', (e) => {
                if (e.touches.length > 0) {
                    handleMove(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: true });

            function handleMove(clientX, clientY) {
                if (draggedObj) {
                    mouseVx = clientX - lastMouseX;
                    mouseVy = clientY - lastMouseY;
                    draggedObj.x = clientX - dragOffsetX;
                    draggedObj.y = clientY - dragOffsetY;
                    lastMouseX = clientX;
                    lastMouseY = clientY;
                }
            }

            // Release Dragged Object
            window.addEventListener('mouseup', releaseDrag);
            window.addEventListener('touchend', releaseDrag);

            function releaseDrag() {
                if (draggedObj) {
                    draggedObj.vx = mouseVx * 0.8;
                    draggedObj.vy = mouseVy * 0.8;
                    draggedObj.vRot = (Math.random() - 0.5) * 8;
                    draggedObj.isDragged = false;
                    draggedObj = null;
                }
            }

            const gravity = 0.55;

            // Physics Loop
            function updatePhysics() {
                const screenWidth = window.innerWidth;
                const screenHeight = window.innerHeight;

                // Calculate Window Movement Across Monitor
                const currentWindowX = window.screenX || window.screenLeft || 0;
                const currentWindowY = window.screenY || window.screenTop || 0;

                const windowDeltaX = currentWindowX - lastWindowX;
                const windowDeltaY = currentWindowY - lastWindowY;

                lastWindowX = currentWindowX;
                lastWindowY = currentWindowY;

                physicsObjects.forEach(obj => {
                    // Apply Window Inertia (Moving window right pushes objects left)
                    if (Math.abs(windowDeltaX) > 0.5 || Math.abs(windowDeltaY) > 0.5) {
                        obj.vx -= windowDeltaX * 0.8;
                        obj.vy -= windowDeltaY * 0.8;
                        obj.vRot += (windowDeltaX + windowDeltaY) * 0.1; // Add spin from window motion
                    }

                    if (!obj.isDragged) {
                        // Apply gravity
                        obj.vy += gravity;

                        // Update position & rotation
                        obj.x += obj.vx;
                        obj.y += obj.vy;
                        obj.rotation += obj.vRot;

                        // Floor Collision
                        if (obj.y + obj.height >= screenHeight) {
                            obj.y = screenHeight - obj.height;
                            obj.vy = -obj.vy * obj.bounciness;
                            obj.vx *= 0.85; // Floor friction
                            obj.vRot *= 0.85;
                        }

                        // Ceiling Collision
                        if (obj.y <= 0) {
                            obj.y = 0;
                            obj.vy = -obj.vy * obj.bounciness;
                        }

                        // Right Wall Collision
                        if (obj.x + obj.width >= screenWidth) {
                            obj.x = screenWidth - obj.width;
                            obj.vx = -obj.vx * obj.bounciness;
                        }

                        // Left Wall Collision
                        if (obj.x <= 0) {
                            obj.x = 0;
                            obj.vx = -obj.vx * obj.bounciness;
                        }
                    } else {
                        // Keep within bounds while dragging
                        obj.x = Math.max(0, Math.min(obj.x, screenWidth - obj.width));
                        obj.y = Math.max(0, Math.min(obj.y, screenHeight - obj.height));
                    }

                    // Apply visual transformation
                    obj.element.style.transform = `translate(${obj.x - parseFloat(obj.element.style.left)}px, ${obj.y - parseFloat(obj.element.style.top)}px) rotate(${obj.rotation}deg)`;
                });

                requestAnimationFrame(updatePhysics);
            }

            requestAnimationFrame(updatePhysics);
        }
    </script>
